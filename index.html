<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brunei Travel Itinerary App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            background-color: #f0f4f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Device Container Styling matching Figma specs */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 932px;
            position: relative;
            background: #C2E6DB;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 480px) {
            .app-container {
                height: 100vh;
                max-width: 100vw;
                border-radius: 0;
            }
        }

        /* Map styling */
        #map {
            width: 100%;
            height: 285px;
            border-radius: 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        /* Modal map preview */
        #modal-map-preview {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            margin-top: 8px;
        }

        /* Hide Leaflet / OpenStreetMap attribution watermark */
        .leaflet-control-attribution {
            display: none !important;
        }

        /* Custom Leaflet Numbered Pin */
        .custom-numbered-pin {
            background-color: #ED9D04;
            color: white;
            font-weight: bold;
            font-size: 11px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Bottom Sheet Styling */
        .sheet-container {
            position: absolute;
            top: 390px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #F5F5F5;
            box-shadow: 0px -5px 15px rgba(0, 0, 0, 0.12);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            display: flex;
            flex-direction: column;
            z-index: 20;
            padding-bottom: 80px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 16px;
            left: 28px;
            right: 28px;
            height: 58px;
            background: #40240B;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
            box-shadow: 0 10px 20px rgba(64, 36, 11, 0.3);
            z-index: 30;
        }

        .nav-item {
            color: #F3EBE5;
            font-size: 20px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Timeline Connector Lines */
        .timeline-line {
            position: absolute;
            left: 17px;
            top: 24px;
            bottom: -24px;
            width: 3px;
            background-color: #E8E6E6;
        }

        .timeline-line.active {
            background-color: #ED9D04;
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Live Sync Pulse Dot */
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Navigation Bar -->
        <div class="flex items-center justify-between px-6 pt-5 pb-2 z-10">
            <button id="btn-back" class="w-9 h-9 flex items-center justify-center text-gray-800 hover:bg-black/5 rounded-full transition-colors">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <div class="flex items-center gap-1.5">
                <span class="text-lg font-semibold text-gray-800">Itinerary</span>
                <div class="pulse-dot" title="Live Cloud Sync Active"></div>
            </div>
            <!-- Share Link Button -->
            <button id="btn-share-itinerary" class="w-9 h-9 flex items-center justify-center text-gray-800 hover:bg-black/5 rounded-full transition-colors" title="Share Itinerary">
                <i class="fa-solid fa-share-nodes text-lg text-emerald-800"></i>
            </button>
        </div>

        <!-- Section Title & Interactive Map -->
        <div class="px-6 pb-3 z-10">
            <h1 class="text-2xl font-bold text-gray-900 mb-3">My Plan</h1>
            <div id="map"></div>
        </div>

        <!-- Bottom Sheet Container for Today's Plan -->
        <div class="sheet-container">
            <!-- Header with Title & Filter -->
            <div class="flex items-center justify-between px-6 pt-5 pb-3">
                <h2 class="text-2xl font-bold text-gray-900">Today’s Plan</h2>
                <button id="btn-filter" class="p-2 text-gray-700 hover:text-gray-900 transition-colors">
                    <i class="fa-solid fa-sliders text-xl"></i>
                </button>
            </div>

            <!-- Horizontal Date Picker Row (6 to 11 August) -->
            <div class="flex gap-2.5 px-5 overflow-x-auto no-scrollbar pb-3" id="date-picker-row">
                <!-- Days will be generated by JS -->
            </div>

            <!-- Day Selector Tabs -->
            <div class="flex border-b border-gray-200 px-6 mb-3">
                <button class="day-tab text-sm font-semibold py-2 px-4 border-b-2 border-[#98C2B5] text-[#98C2B5]" data-day="1">
                    Day 1 <span class="text-[10px] font-normal block text-gray-500">8 August, Wednesday</span>
                </button>
                <button class="day-tab text-sm font-semibold py-2 px-4 text-gray-400 border-b-2 border-transparent" data-day="2">
                    Day 2 <span class="text-[10px] font-normal block text-gray-400">9 August, Thursday</span>
                </button>
            </div>

            <!-- Itinerary Timeline List -->
            <div class="flex-1 overflow-y-auto px-6 no-scrollbar pb-16" id="itinerary-list">
                <!-- Timeline items rendered dynamically -->
            </div>

            <!-- Floating Action Button (+ Add Location) -->
            <button id="btn-add-plan" class="absolute right-6 bottom-24 w-12 h-12 bg-[#98C2B5] hover:bg-[#83b0a2] text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95 z-30">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <button class="nav-item">
                <i class="fa-solid fa-house"></i>
            </button>
            <button class="nav-item active">
                <i class="fa-solid fa-calendar-days"></i>
            </button>
            <button class="nav-item">
                <i class="fa-solid fa-comment-dots"></i>
            </button>
            <button class="nav-item">
                <i class="fa-solid fa-user"></i>
            </button>
        </div>

        <!-- Add/Edit Location Modal -->
        <div id="add-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button id="btn-close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <h3 id="modal-title-text" class="text-lg font-bold text-gray-900 mb-4">Add Place to Plan</h3>
                
                <form id="add-plan-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Visit Time</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <span class="text-[10px] text-gray-400 font-medium block mb-0.5">Hour</span>
                                <select id="input-time-hour" class="w-full px-2 py-2 border rounded-xl focus:ring-2 focus:ring-[#98C2B5] focus:outline-none text-xs font-semibold bg-white"></select>
                            </div>
                            <div>
                                <span class="text-[10px] text-gray-400 font-medium block mb-0.5">Minute</span>
                                <select id="input-time-minute" class="w-full px-2 py-2 border rounded-xl focus:ring-2 focus:ring-[#98C2B5] focus:outline-none text-xs font-semibold bg-white"></select>
                            </div>
                            <div>
                                <span class="text-[10px] text-gray-400 font-medium block mb-0.5">Period</span>
                                <select id="input-time-ampm" class="w-full px-2 py-2 border rounded-xl focus:ring-2 focus:ring-[#98C2B5] focus:outline-none text-xs font-bold bg-amber-50 border-amber-300 text-amber-700">
                                    <option value="AM">AM</option>
                                    <option value="PM">PM</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Location Name (Auto-searches Map)</label>
                        <div class="relative">
                            <div class="flex gap-2">
                                <input type="text" id="input-title" placeholder="e.g. Jerudong Park, Brunei Museum" required class="flex-1 px-3 py-2 border rounded-xl focus:ring-2 focus:ring-[#98C2B5] focus:outline-none text-sm">
                                <button type="button" id="btn-search-location" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-xl text-xs flex items-center gap-1 shadow-sm transition-colors">
                                    <i class="fa-solid fa-magnifying-glass"></i> Find
                                </button>
                            </div>
                            <!-- Search Results Dropdown -->
                            <div id="search-results-dropdown" class="absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg z-50 max-h-48 overflow-y-auto hidden text-xs"></div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Or Pick Preset Brunei Landmark</label>
                        <select id="select-preset-location" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-[#98C2B5] focus:outline-none text-sm bg-white">
                            <option value="">-- Choose a Brunei Landmark --</option>
                            <option value="Omar Ali Saifuddien Mosque|4.8894|114.9392">Omar Ali Saifuddien Mosque (Golden Mosque)</option>
                            <option value="Jame' 'Asr Hassanil Bolkiah Mosque|4.9081|114.9228">Jame' 'Asr Hassanil Bolkiah Mosque</option>
                            <option value="Kampong Ayer Water Village|4.8833|114.9433">Kampong Ayer (Water Village)</option>
                            <option value="The Empire Brunei Resort|4.9667|114.8522">The Empire Brunei Resort</option>
                            <option value="Gadong Night Market|4.9128|114.9256">Gadong Night Market</option>
                            <option value="Royal Regalia Museum|4.8883|114.9408">Royal Regalia Museum</option>
                            <option value="Tasek Lama Recreational Park|4.8988|114.9413">Tasek Lama Recreational Park</option>
                            <option value="Jerudong Park Playground|4.9422|114.8385">Jerudong Park Playground</option>
                        </select>
                    </div>

                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-200">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-bold text-amber-900">Real-time Location Coordinates</label>
                            <span class="text-[10px] text-amber-700"><i class="fa-solid fa-map-pin mr-1"></i>Tap map to pick</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <span class="text-[10px] text-gray-500">Latitude</span>
                                <input type="number" step="any" id="input-lat" value="4.8894" required class="w-full px-2 py-1 bg-white border rounded-lg text-xs">
                            </div>
                            <div>
                                <span class="text-[10px] text-gray-500">Longitude</span>
                                <input type="number" step="any" id="input-lng" value="114.9392" required class="w-full px-2 py-1 bg-white border rounded-lg text-xs">
                            </div>
                        </div>
                        <!-- Modal Map Preview -->
                        <div id="modal-map-preview"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Notes / Activities</label>
                        <textarea id="input-notes" rows="2" placeholder="e.g. Take photos, try local food..." class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-[#98C2B5] focus:outline-none text-sm"></textarea>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="button" id="btn-cancel" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl text-sm transition-colors">Cancel</button>
                        <button type="submit" class="flex-1 py-2.5 bg-[#98C2B5] hover:bg-[#82b3a5] text-white font-semibold rounded-xl text-sm shadow-md transition-colors">Save Plan</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Share Link Modal -->
        <div id="share-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl relative">
                <button id="btn-close-share-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <div class="flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-users text-amber-500 text-xl"></i>
                    <h3 class="text-lg font-bold text-gray-900">Share & Collaborative Edit</h3>
                </div>
                <p class="text-xs text-gray-600 mb-4">
                    Send this link to your trip companions! Anyone with this link can view and edit this itinerary in real-time.
                </p>

                <div class="bg-gray-50 border border-gray-200 p-2.5 rounded-xl flex items-center gap-2 mb-4">
                    <input type="text" id="share-link-input" readonly class="bg-transparent text-xs text-gray-700 flex-1 outline-none font-mono selection:bg-amber-200">
                    <button id="btn-copy-link" onclick="window.copyShareLink()" class="px-3 py-1.5 bg-[#98C2B5] hover:bg-[#82b3a5] text-white font-semibold rounded-lg text-xs flex items-center gap-1 shadow-sm transition-colors flex-shrink-0">
                        <i class="fa-solid fa-copy"></i> Copy
                    </button>
                </div>

                <div class="flex gap-2">
                    <button type="button" id="btn-new-trip" onclick="window.createNewTrip()" class="w-full py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 font-semibold rounded-xl text-xs transition-colors border border-amber-300">
                        <i class="fa-solid fa-plus-circle mr-1"></i> Start New Empty Trip
                    </button>
                </div>
            </div>
        </div>

        <!-- Success Toast Notification -->
        <div id="toast-msg" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white px-4 py-2 rounded-full text-xs font-medium shadow-xl z-50 flex items-center gap-2 opacity-0 pointer-events-none transition-opacity duration-300">
            <i class="fa-solid fa-check text-emerald-400"></i>
            <span id="toast-text">Copied share link to clipboard!</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables provided by environment or default
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'brunei-travel-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyFakeKeyForTestingOnly",
                authDomain: "brunei-travel-app.firebaseapp.com",
                projectId: "brunei-travel-app",
                storageBucket: "brunei-travel-app.appspot.com",
                messagingSenderId: "1234567890",
                appId: "1:1234567890:web:1234567890"
              };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let unsubscribeFirestore = null;

        // Default Itinerary Data for Brunei
        const defaultItineraryData = [
            { id: 1, day: 1, time: "08:30", title: "Mr Baker's Bakeshop", lat: 4.9135, lng: 114.9315, notes: "Enjoy breakfast and coffee", status: "completed" },
            { id: 2, day: 1, time: "10:00", title: "Tasek Lama Park", lat: 4.8988, lng: 114.9413, notes: "Hike for 20 minutes\nTake photo of waterfall", status: "active" },
            { id: 3, day: 1, time: "13:00", title: "Aminah Arif Restaurant", lat: 4.8885, lng: 114.9380, notes: "Try traditional Ambuyat dish", status: "upcoming" },
            { id: 4, day: 1, time: "16:30", title: "Yayasan Sultan Complex", lat: 4.8880, lng: 114.9400, notes: "Shopping and sunset view over Golden Mosque", status: "upcoming" },
            { id: 5, day: 2, time: "09:00", title: "Kampong Ayer Water Village", lat: 4.8833, lng: 114.9433, notes: "Water taxi tour and cultural house visit", status: "upcoming" },
            { id: 6, day: 2, time: "18:00", title: "Gadong Night Market", lat: 4.9128, lng: 114.9256, notes: "Taste local street foods & satay", status: "upcoming" }
        ];

        let itineraryData = [...defaultItineraryData];
        let selectedDay = 1;
        let selectedDate = 8; // August 8
        let editingId = null;
        let currentTripId = getOrInitTripId();

        // Leaflet Map Variables
        let mainMap, modalMap;
        let mapMarkers = [];
        let mapPolyline = null;
        let livePreviewMarker = null;

        function getOrInitTripId() {
            const hash = window.location.hash.replace('#', '');
            const params = new URLSearchParams(hash);
            if (params.has('trip') && params.get('trip').trim().length > 0) {
                return params.get('trip').trim();
            }
            // Generate friendly new trip ID
            const newTripId = 'brunei-' + Math.random().toString(36).substring(2, 9);
            window.location.hash = `trip=${newTripId}`;
            return newTripId;
        }

        function updateShareLinkInput() {
            const shareUrl = window.location.href;
            const input = document.getElementById('share-link-input');
            if (input) input.value = shareUrl;
        }

        // Convert 24-hour time string ("13:00") to English AM/PM format ("1:00 PM")
        function formatEnglishTime(timeStr) {
            if (!timeStr) return '';
            const [hStr, mStr] = timeStr.split(':');
            let hours = parseInt(hStr, 10);
            const minutes = mStr || '00';
            if (isNaN(hours)) return timeStr;
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // convert 0 to 12
            return `${hours}:${minutes} ${ampm}`;
        }

        async function initCloudSync() {
            try {
                const authToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (authToken) {
                    const userCred = await signInWithCustomToken(auth, authToken);
                    currentUser = userCred.user;
                } else {
                    const userCred = await signInAnonymously(auth);
                    currentUser = userCred.user;
                }

                if (!currentUser) return;

                // Subscribe to doc at /artifacts/{appId}/public/data/trips/{currentTripId}
                const tripDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'trips', currentTripId);

                if (unsubscribeFirestore) {
                    unsubscribeFirestore();
                }

                unsubscribeFirestore = onSnapshot(tripDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        // Always sync itineraryData with remote items, even if empty array []
                        if (data && Array.isArray(data.items)) {
                            itineraryData = data.items;
                            renderItinerary();
                            updateMapMarkers();
                        }
                    } else {
                        // Document doesn't exist yet, save default initial data to Firestore
                        saveToCloud(defaultItineraryData);
                    }
                }, (error) => {
                    console.error("Firestore error:", error);
                });

            } catch (err) {
                console.warn("Cloud sync fallback to local:", err);
            }
        }

        async function saveToCloud(newItems) {
            if (!currentUser) return;
            try {
                const tripDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'trips', currentTripId);
                await setDoc(tripDocRef, {
                    items: newItems,
                    updatedAt: new Date().toISOString()
                }, { merge: false }); // Use merge: false to guarantee deletions are overwritten correctly
            } catch (err) {
                console.error("Failed to save to cloud:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTimePickerOptions();
            initMainMap();
            renderDatePicker();
            renderItinerary();
            setupEventListeners();
            initCloudSync();
            updateShareLinkInput();

            // Listen to hash changes (e.g. user opens a new trip link in same browser)
            window.addEventListener('hashchange', () => {
                const newId = getOrInitTripId();
                if (newId !== currentTripId) {
                    currentTripId = newId;
                    if (unsubscribeFirestore) unsubscribeFirestore();
                    initCloudSync();
                    updateShareLinkInput();
                }
            });
        });

        // Initialize English Time Picker Dropdown Options
        function initTimePickerOptions() {
            const hourSelect = document.getElementById('input-time-hour');
            const minuteSelect = document.getElementById('input-time-minute');

            let hourHtml = '';
            for (let h = 1; h <= 12; h++) {
                const val = h < 10 ? `0${h}` : `${h}`;
                hourHtml += `<option value="${val}">${val}</option>`;
            }
            hourSelect.innerHTML = hourHtml;

            let minuteHtml = '';
            for (let m = 0; m < 60; m += 5) {
                const val = m < 10 ? `0${m}` : `${m}`;
                minuteHtml += `<option value="${val}">${val}</option>`;
            }
            minuteSelect.innerHTML = minuteHtml;

            // Set default: 11:30 AM
            hourSelect.value = "11";
            minuteSelect.value = "30";
            document.getElementById('input-time-ampm').value = "AM";
        }

        function initMainMap() {
            mainMap = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([4.8950, 114.9380], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mainMap);

            updateMapMarkers();
        }

        function initModalMap() {
            if (modalMap) return;
            
            modalMap = L.map('modal-map-preview', {
                zoomControl: false,
                attributionControl: false
            }).setView([4.8894, 114.9392], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMap);

            modalMap.on('click', (e) => {
                const lat = e.latlng.lat.toFixed(4);
                const lng = e.latlng.lng.toFixed(4);
                document.getElementById('input-lat').value = lat;
                document.getElementById('input-lng').value = lng;
                updateLivePreviewMarker(lat, lng);
            });
        }

        function updateLivePreviewMarker(lat, lng) {
            if (!modalMap) return;
            const parsedLat = parseFloat(lat);
            const parsedLng = parseFloat(lng);

            if (isNaN(parsedLat) || isNaN(parsedLng)) return;

            const latlng = [parsedLat, parsedLng];

            if (livePreviewMarker) {
                livePreviewMarker.setLatLng(latlng);
            } else {
                livePreviewMarker = L.marker(latlng).addTo(modalMap);
            }

            modalMap.setView(latlng, 14);
        }

        function updateMapMarkers() {
            mapMarkers.forEach(m => mainMap.removeLayer(m));
            mapMarkers = [];
            if (mapPolyline) mainMap.removeLayer(mapPolyline);

            const currentItems = itineraryData.filter(item => item.day === selectedDay);
            if (currentItems.length === 0) return;

            const latLngs = [];

            currentItems.forEach((item, index) => {
                const latLng = [item.lat, item.lng];
                latLngs.push(latLng);

                const customIcon = L.divIcon({
                    className: 'custom-pin-container',
                    html: `<div class="custom-numbered-pin">${index + 1}</div>`,
                    iconSize: [26, 26],
                    iconAnchor: [13, 13]
                });

                const marker = L.marker(latLng, { icon: customIcon }).addTo(mainMap);
                marker.bindPopup(`<b>${formatEnglishTime(item.time)} - ${item.title}</b>`);
                mapMarkers.push(marker);
            });

            if (latLngs.length > 1) {
                mapPolyline = L.polyline(latLngs, {
                    color: '#ED9D04',
                    weight: 3,
                    dashArray: '5, 8',
                    opacity: 0.8
                }).addTo(mainMap);
            }

            if (latLngs.length > 0) {
                const bounds = L.latLngBounds(latLngs);
                mainMap.fitBounds(bounds, { padding: [30, 30] });
            }
        }

        function renderDatePicker() {
            const dateRow = document.getElementById('date-picker-row');
            const dates = [
                { dayName: 'Monday', dateNum: 6, month: 'August' },
                { dayName: 'Tuesday', dateNum: 7, month: 'August' },
                { dayName: 'Wednesday', dateNum: 8, month: 'August' },
                { dayName: 'Thursday', dateNum: 9, month: 'August' },
                { dayName: 'Friday', dateNum: 10, month: 'August' },
                { dayName: 'Saturday', dateNum: 11, month: 'August' },
            ];

            dateRow.innerHTML = dates.map(d => {
                const isActive = d.dateNum === selectedDate;
                return `
                    <div class="flex-shrink-0 w-[62px] h-[71px] rounded-xl flex flex-col items-center justify-between py-1.5 border transition-all cursor-pointer ${
                        isActive 
                        ? 'bg-[#F7CD4F] border-[#FFC003] text-gray-900 shadow-sm font-bold' 
                        : 'bg-[#E8E6E6] border-black/10 text-gray-600'
                    }" onclick="window.selectDate(${d.dateNum})">
                        <span class="text-[8px] uppercase tracking-wider">${d.dayName}</span>
                        <span class="text-2xl font-bold leading-none">${d.dateNum}</span>
                        <span class="text-[8px] uppercase tracking-wider">${d.month}</span>
                    </div>
                `;
            }).join('');
        }

        window.selectDate = function(dateNum) {
            selectedDate = dateNum;
            selectedDay = dateNum === 8 ? 1 : (dateNum === 9 ? 2 : 1);
            
            document.querySelectorAll('.day-tab').forEach(tab => {
                const tabDay = parseInt(tab.dataset.day);
                if (tabDay === selectedDay) {
                    tab.classList.add('border-[#98C2B5]', 'text-[#98C2B5]');
                    tab.classList.remove('border-transparent', 'text-gray-400');
                } else {
                    tab.classList.remove('border-[#98C2B5]', 'text-[#98C2B5]');
                    tab.classList.add('border-transparent', 'text-gray-400');
                }
            });

            renderDatePicker();
            renderItinerary();
            updateMapMarkers();
        };

        function renderItinerary() {
            const listContainer = document.getElementById('itinerary-list');
            const currentItems = itineraryData.filter(item => item.day === selectedDay);

            if (currentItems.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 text-gray-400">
                        <i class="fa-solid fa-map-location-dot text-4xl mb-2"></i>
                        <p class="text-sm">No plans for this day yet.</p>
                        <p class="text-xs text-gray-400">Click + button below to add places!</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = currentItems.map((item, index) => {
                const isLast = index === currentItems.length - 1;
                
                let dotColor = "bg-[#E8E6E6]";
                let lineColor = false;
                let activeCardStyle = "";

                if (item.status === 'completed') {
                    dotColor = "bg-gray-400";
                } else if (item.status === 'active') {
                    dotColor = "bg-[#ED9D04]";
                    lineColor = true;
                    activeCardStyle = "border border-amber-300 bg-white shadow-sm p-3 rounded-2xl";
                } else {
                    dotColor = "bg-[#ED9D04]";
                }

                return `
                    <div class="relative flex gap-4 mb-5 cursor-pointer group" onclick="window.panToLocation(${item.lat}, ${item.lng})">
                        <!-- Timeline Column -->
                        <div class="relative flex flex-col items-center">
                            <div class="w-3.5 h-3.5 rounded-full ${dotColor} z-10 border-2 border-white shadow-sm"></div>
                            ${!isLast ? `<div class="timeline-line ${lineColor ? 'active' : ''}"></div>` : ''}
                        </div>

                        <!-- Content Column -->
                        <div class="flex-1 -mt-1 ${activeCardStyle}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="text-sm font-semibold text-gray-900">${formatEnglishTime(item.time)}</span>
                                    <h4 class="text-base font-bold text-gray-900 leading-snug">${item.title}</h4>
                                </div>
                                <button onclick="event.stopPropagation(); window.deletePlan(${item.id})" class="text-gray-300 hover:text-red-500 p-1 transition-colors">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>

                            ${item.notes ? `
                                <p class="text-xs text-gray-500 mt-1 whitespace-pre-line">${item.notes}</p>
                            ` : ''}

                            ${item.status === 'active' ? `
                                <span class="inline-block text-[11px] font-medium text-amber-600 mt-2 bg-amber-50 px-2 py-0.5 rounded-md">Next coming up</span>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.panToLocation = function(lat, lng) {
            mainMap.flyTo([lat, lng], 15, { duration: 1.2 });
        };

        window.deletePlan = function(id) {
            itineraryData = itineraryData.filter(item => item.id !== id);
            renderItinerary();
            updateMapMarkers();
            saveToCloud(itineraryData);
        };

        window.copyShareLink = function() {
            const input = document.getElementById('share-link-input');
            if (input) {
                input.select();
                try {
                    document.execCommand('copy');
                    showToast("Share link copied to clipboard!");
                } catch (e) {
                    showToast("Failed to copy link.");
                }
            }
        };

        window.createNewTrip = function() {
            const newTripId = 'brunei-' + Math.random().toString(36).substring(2, 9);
            window.location.hash = `trip=${newTripId}`;
            currentTripId = newTripId;
            itineraryData = [];
            renderItinerary();
            updateMapMarkers();
            saveToCloud([]);
            document.getElementById('share-modal').classList.add('hidden');
            showToast("New trip created! Share link updated.");
        };

        function showToast(text) {
            const toast = document.getElementById('toast-msg');
            const toastText = document.getElementById('toast-text');
            if (toast && toastText) {
                toastText.innerText = text;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 2500);
            }
        }

        function setupEventListeners() {
            // Day Tab switching
            document.querySelectorAll('.day-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const day = parseInt(e.currentTarget.dataset.day);
                    selectedDay = day;
                    selectedDate = day === 1 ? 8 : 9;

                    document.querySelectorAll('.day-tab').forEach(t => {
                        t.classList.remove('border-[#98C2B5]', 'text-[#98C2B5]');
                        t.classList.add('border-transparent', 'text-gray-400');
                    });
                    e.currentTarget.classList.add('border-[#98C2B5]', 'text-[#98C2B5]');

                    renderDatePicker();
                    renderItinerary();
                    updateMapMarkers();
                });
            });

            // Modal Trigger Buttons
            const modal = document.getElementById('add-modal');
            const shareModal = document.getElementById('share-modal');
            const btnAdd = document.getElementById('add-plan-form');

            document.getElementById('btn-add-plan').addEventListener('click', () => {
                editingId = null;
                document.getElementById('modal-title-text').innerText = "Add Place to Plan";
                btnAdd.reset();
                document.getElementById('input-time-hour').value = "11";
                document.getElementById('input-time-minute').value = "30";
                document.getElementById('input-time-ampm').value = "AM";
                modal.classList.remove('hidden');

                setTimeout(() => {
                    initModalMap();
                    modalMap.invalidateSize();
                    updateLivePreviewMarker(4.8894, 114.9392);
                }, 200);
            });

            document.getElementById('btn-share-itinerary').addEventListener('click', () => {
                updateShareLinkInput();
                shareModal.classList.remove('hidden');
            });

            document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.add('hidden'));
            document.getElementById('btn-cancel').addEventListener('click', () => modal.classList.add('hidden'));
            document.getElementById('btn-close-share-modal').addEventListener('click', () => shareModal.classList.add('hidden'));

            // Real-time Lat/Lng Inputs Listener
            const latInput = document.getElementById('input-lat');
            const lngInput = document.getElementById('input-lng');

            ['input', 'change'].forEach(eventType => {
                latInput.addEventListener(eventType, () => updateLivePreviewMarker(latInput.value, lngInput.value));
                lngInput.addEventListener(eventType, () => updateLivePreviewMarker(latInput.value, lngInput.value));
            });

            // Auto Geocoding Logic using OpenStreetMap Nominatim (English output)
            let geocodeTimeout = null;
            const inputTitle = document.getElementById('input-title');
            const btnSearchLoc = document.getElementById('btn-search-location');
            const dropdown = document.getElementById('search-results-dropdown');

            async function searchLocation(query, autoApply = false) {
                if (!query || query.trim().length < 2) {
                    dropdown.classList.add('hidden');
                    return;
                }

                btnSearchLoc.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

                try {
                    const searchQuery = query.toLowerCase().includes('brunei') ? query : `${query}, Brunei`;
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=en&q=${encodeURIComponent(searchQuery)}&limit=5`);
                    const data = await res.json();

                    btnSearchLoc.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> Find`;

                    if (data && data.length > 0) {
                        dropdown.innerHTML = data.map(item => `
                            <div class="p-2 hover:bg-amber-50 cursor-pointer border-b border-gray-100 last:border-none font-medium text-gray-800 flex items-start gap-2 search-item" 
                                 data-lat="${item.lat}" data-lng="${item.lon}" data-name="${item.display_name.split(',')[0]}">
                                <i class="fa-solid fa-location-dot text-amber-500 mt-0.5 flex-shrink-0"></i>
                                <div>
                                    <div class="font-semibold text-gray-900">${item.display_name.split(',')[0]}</div>
                                    <div class="text-[10px] text-gray-500 line-clamp-1">${item.display_name}</div>
                                </div>
                            </div>
                        `).join('');
                        dropdown.classList.remove('hidden');

                        if (autoApply) {
                            const top = data[0];
                            applyLocationSelection(top.lat, top.lon);
                        }
                    } else {
                        dropdown.innerHTML = `<div class="p-2 text-gray-400 text-center">No results found in Brunei. Try another keyword.</div>`;
                        dropdown.classList.remove('hidden');
                    }
                } catch (err) {
                    console.error('Geocoding error:', err);
                    btnSearchLoc.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> Find`;
                }
            }

            function applyLocationSelection(lat, lng) {
                const formattedLat = parseFloat(lat).toFixed(4);
                const formattedLng = parseFloat(lng).toFixed(4);
                
                latInput.value = formattedLat;
                lngInput.value = formattedLng;
                updateLivePreviewMarker(formattedLat, formattedLng);
            }

            btnSearchLoc.addEventListener('click', () => searchLocation(inputTitle.value, true));

            inputTitle.addEventListener('input', (e) => {
                clearTimeout(geocodeTimeout);
                geocodeTimeout = setTimeout(() => searchLocation(e.target.value, true), 600);
            });

            dropdown.addEventListener('click', (e) => {
                const item = e.target.closest('.search-item');
                if (item) {
                    inputTitle.value = item.dataset.name;
                    applyLocationSelection(item.dataset.lat, item.dataset.lng);
                    dropdown.classList.add('hidden');
                }
            });

            document.addEventListener('click', (e) => {
                if (!inputTitle.contains(e.target) && !dropdown.contains(e.target) && !btnSearchLoc.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });

            // Preset location dropdown selection
            document.getElementById('select-preset-location').addEventListener('change', (e) => {
                const val = e.target.value;
                if (val) {
                    const [name, lat, lng] = val.split('|');
                    document.getElementById('input-title').value = name;
                    latInput.value = lat;
                    lngInput.value = lng;
                    updateLivePreviewMarker(lat, lng);
                }
            });

            // Handle Form Submission
            btnAdd.addEventListener('submit', (e) => {
                e.preventDefault();

                const h = document.getElementById('input-time-hour').value;
                const m = document.getElementById('input-time-minute').value;
                const ampm = document.getElementById('input-time-ampm').value;

                let hourNum = parseInt(h, 10);
                if (ampm === 'PM' && hourNum < 12) hourNum += 12;
                if (ampm === 'AM' && hourNum === 12) hourNum = 0;

                const time = `${String(hourNum).padStart(2, '0')}:${m}`;
                const title = document.getElementById('input-title').value;
                const lat = parseFloat(document.getElementById('input-lat').value);
                const lng = parseFloat(document.getElementById('input-lng').value);
                const notes = document.getElementById('input-notes').value;

                const newPlan = {
                    id: Date.now(),
                    day: selectedDay,
                    time: time,
                    title: title,
                    lat: lat,
                    lng: lng,
                    notes: notes,
                    status: 'upcoming'
                };

                itineraryData.push(newPlan);
                itineraryData.sort((a, b) => a.time.localeCompare(b.time));

                renderItinerary();
                updateMapMarkers();
                saveToCloud(itineraryData);

                modal.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
