        /**
         * Real Google Gemini API Call with JSON Structured Output

        async function fetchGeminiItinerary(userInstruction, apiKey = "") {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            const systemPrompt = `You are a world-class travel planner for Brunei Darussalam. 
Generate a realistic travel itinerary for a tourist visiting Brunei Darussalam based strictly on the user's prompt or preference.
STRICT RULE FOR QUANTITY:
Follow all requested plan/item counts in prompt (e.g. "7 plans" = output EXACTLY 7 items). Put them in Day 1 unless multiple days are specified.
You MUST output a JSON array of objects. Each object represents a place or activity in the itinerary.
Ensure real, accurate geographic coordinates in Brunei (latitude around 4.5 to 5.1, longitude around 114.5 to 115.1).
Use 24-hour format for time (e.g. "08:30", "13:00"). Day must be integer (1, 2, 3...). Write concise titles and notes in English.`;

            const payload = {
                contents: [
                    { parts: [{ text: `Generate a Brunei travel itinerary strictly tailored to this request: "${userInstruction}". Follow exact count requested.` }] }
                ],
                systemInstruction: {

                                "time": { "type": "STRING", "description": "24h format HH:MM e.g. 09:30" },
                                "title": { "type": "STRING" },
                                "lat": { "type": "NUMBER" },
                                "lng": { "type": "NUMBER" },
                                "notes": { "type": "STRING" }

                        }
                    }
                }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            } catch (err) {
                console.warn("Cloud sync error:", err);
            }
        }

        async function saveToCloud(newItems) {

            try {

        async function fetchGeminiItinerary(userInstruction, apiKey) {
            let systemPrompt = `You are a travel planner for Brunei Darussalam.
Generate a realistic travel itinerary for Brunei based strictly on user prompt.
STRICT RULE FOR QUANTITY & DAYS:
1. Carefully follow requested plan counts in prompt (e.g. "7 plans" = output EXACTLY 7 items).
2. If user asks for N plans without specifying multiple days, put ALL N items under Day 1.
3. Output a valid JSON array of objects with keys: "day" (number), "time" (24h HH:MM), "title" (string), "lat" (number 4.5 to 5.1), "lng" (number 114.5 to 115.1), "notes" (string).`;

            try {
                if (GITHUB_PROMPT_URL && !GITHUB_PROMPT_URL.includes("your-username")) {
                    const promptRes = await fetch(GITHUB_PROMPT_URL);
                    if (promptRes.ok) {
                        const rawText = await promptRes.text();
                        if (rawText.trim().length > 0) systemPrompt = rawText.trim();
                    }
                }
            } catch (err) {
                console.warn("Could not fetch prompt from GitHub Raw, using built-in system prompt:", err);
            }

            const modelNames = ["gemini-2.5-flash", "gemini-1.5-flash"];
            let lastError = null;

            for (const model of modelNames) {
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                    const payload = {
                        contents: [{ parts: [{ text: `Generate a Brunei travel itinerary strictly tailored to this user request: "${userInstruction}". Ensure exact count requested.` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        "day": { "type": "INTEGER" },
                                        "time": { "type": "STRING" },
                                        "title": { "type": "STRING" },
                                        "lat": { "type": "NUMBER" },
                                        "lng": { "type": "NUMBER" },
                                        "notes": { "type": "STRING" }
                                    },
                                    "required": ["day", "time", "title", "lat", "lng", "notes"]
                                }
                            }
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `API Error ${response.status}`);
                    }

                    const result = await response.json();
                    const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!jsonText) throw new Error("Empty response from Gemini.");

                    const parsedData = JSON.parse(jsonText);
                    return parsedData.map((item, index) => ({
                        id: Date.now() + index,
                        day: parseInt(item.day) || 1,
                        time: item.time || "10:00",
                        title: item.title || "Brunei Landmark",
                        lat: parseFloat(item.lat) || 4.8894,
                        lng: parseFloat(item.lng) || 114.9392,
                        notes: item.notes || "",
                        status: index === 0 ? "active" : "upcoming"
                    }));

                } catch (err) {
                    lastError = err;
                    console.warn(`Model ${model} failed, trying next...`, err);
                }
            }

            throw lastError || new Error("Gemini API call failed.");
        }

            const btnGen = document.getElementById('btn-generate-ai');

            if (!keyInput) {
                showToast("Please enter a valid Google Gemini API Key!");
                return;
            }

            localStorage.setItem('gemini_api_key', keyInput);
            loadingBox.classList.remove('hidden');
            btnGen.disabled = true;

            try {
                const generatedItems = await fetchGeminiItinerary(promptInput, keyInput);
                
                itineraryData = generatedItems;
                selectedDay = 1;
                
                renderDayTabs();
                renderDatePicker();
                renderItinerary();
                updateMapMarkers();
                saveToCloud(itineraryData);

                document.getElementById('ai-modal').classList.add('hidden');
                const daysCount = new Set(generatedItems.map(i => i.day)).size;
                showToast(`✨ Generated ${generatedItems.length} place(s) across ${daysCount} day(s)!`);
            } catch (err) {
                console.error("AI Generation failed:", err);
                showToast(`API Error: ${err.message}`);
            } finally {
                loadingBox.classList.add('hidden');
                btnGen.disabled = false;
            }
        }

        function renderDayTabs() {
            const container = document.getElementById('day-tabs-container');
            if (!container) return;

            const daysSet = new Set(itineraryData.map(i => i.day));
            if (daysSet.size === 0) daysSet.add(1);

            const sortedDays = Array.from(daysSet).sort((a, b) => a - b);
            const dayNames = ['Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', 'Monday', 'Tuesday'];

            container.innerHTML = sortedDays.map(d => {
                const isActive = d === selectedDay;
                const countOnDay = itineraryData.filter(i => i.day === d).length;
                const dateNum = 8 + (d - 1);
                const dayName = dayNames[(d - 1) % dayNames.length];

                return `
                    <button class="day-tab text-sm font-semibold py-2 px-4 whitespace-nowrap ${
                        isActive ? 'border-b-2 border-[#98C2B5] text-[#98C2B5]' : 'text-gray-400 border-b-2 border-transparent'
                    }" onclick="window.switchDay(${d})">
                        Day ${d} (${countOnDay}) <span class="text-[10px] font-normal block ${isActive ? 'text-gray-500' : 'text-gray-400'}">${dateNum} Aug, ${dayName}</span>
                    </button>
                `;
            }).join('');
        }

        window.switchDay = function(day) {
            selectedDay = day;
            selectedDate = 8 + (day - 1);
            renderDatePicker();
            renderDayTabs();
            renderItinerary();
            updateMapMarkers();
        };

        function renderDatePicker() {
            const dateRow = document.getElementById('date-picker-row');
            const dates = [
                { dayName: 'Wed', dateNum: 8, month: 'Aug' },
                { dayName: 'Thu', dateNum: 9, month: 'Aug' },
                { dayName: 'Fri', dateNum: 10, month: 'Aug' },
                { dayName: 'Sat', dateNum: 11, month: 'Aug' },
                { dayName: 'Sun', dateNum: 12, month: 'Aug' }
            ];

            dateRow.innerHTML = dates.map(d => {
                const isActive = d.dateNum === selectedDate;
                return `
                    <div class="flex-shrink-0 w-[62px] h-[71px] rounded-xl flex flex-col items-center justify-between py-1.5 border transition-all cursor-pointer ${
                        isActive ? 'bg-[#F7CD4F] border-[#FFC003] text-gray-900 shadow-sm font-bold' : 'bg-[#E8E6E6] border-black/10 text-gray-600'
                    }" onclick="window.selectDate(${d.dateNum})">
                        <span class="text-[8px] uppercase">${d.dayName}</span>
                        <span class="text-2xl font-bold leading-none">${d.dateNum}</span>
                        <span class="text-[8px] uppercase">${d.month}</span>
                    </div>
                `;
            }).join('');
        }

        window.selectDate = function(dateNum) {
            selectedDate = dateNum;
            selectedDay = dateNum >= 8 ? (dateNum - 8 + 1) : 1;
            renderDatePicker();
            renderDayTabs();
            renderItinerary();
            updateMapMarkers();
        };

        function updateMapMarkers() {
            if (!mainMap) return;

            mapMarkers.forEach(m => mainMap.removeLayer(m));
            mapMarkers = [];
            if (mapPolyline) mainMap.removeLayer(mapPolyline);

            const currentItems = itineraryData.filter(item => item.day === selectedDay);
            if (currentItems.length === 0) return;

            const latLngs = [];

            currentItems.forEach((item, index) => {
                const latLng = [item.lat, item.lng];
                latLngs.push(latLng);

                const customIcon = L.divIcon({
                    className: 'custom-pin-container',
                    html: `<div class="custom-numbered-pin">${index + 1}</div>`,
                    iconSize: [26, 26],
                    iconAnchor: [13, 13]
                });

                const marker = L.marker(latLng, { icon: customIcon }).addTo(mainMap);
                marker.bindPopup(`<b>${formatEnglishTime(item.time)} - ${item.title}</b>`);
                mapMarkers.push(marker);
            });

            if (latLngs.length > 1) {
                mapPolyline = L.polyline(latLngs, { color: '#ED9D04', weight: 3, dashArray: '5, 8', opacity: 0.8 }).addTo(mainMap);
            }

            if (latLngs.length > 0) {
                const bounds = L.latLngBounds(latLngs);
                mainMap.fitBounds(bounds, { padding: [30, 30] });
            }
        }

        function renderItinerary() {
            const listContainer = document.getElementById('itinerary-list');
            const currentItems = itineraryData.filter(item => item.day === selectedDay);

            if (currentItems.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 text-gray-400">
                        <i class="fa-solid fa-map-location-dot text-4xl mb-2"></i>
                        <p class="text-sm">No plans for Day ${selectedDay} yet.</p>
                    </div>`;
                return;
            }

            listContainer.innerHTML = currentItems.map((item, index) => `
                <div class="relative flex gap-4 mb-5 cursor-pointer group" onclick="window.panToLocation(${item.lat}, ${item.lng})">
                    <div class="relative flex flex-col items-center">
                        <div class="w-3.5 h-3.5 rounded-full bg-[#ED9D04] z-10 border-2 border-white shadow-sm"></div>
                        ${index !== currentItems.length - 1 ? '<div class="timeline-line"></div>' : ''}
                    </div>
                    <div class="flex-1 -mt-1">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-sm font-semibold text-gray-900">${formatEnglishTime(item.time)}</span>
                                <h4 class="text-base font-bold text-gray-900 leading-snug">${item.title}</h4>
                            </div>
                            <button onclick="event.stopPropagation(); window.deletePlan(${item.id})" class="text-gray-300 hover:text-red-500 p-1">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                        ${item.notes ? `<p class="text-xs text-gray-500 mt-1">${item.notes}</p>` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.panToLocation = function(lat, lng) {
            mainMap.flyTo([lat, lng], 15, { duration: 1.2 });
        };

        window.deletePlan = function(id) {
            itineraryData = itineraryData.filter(item => item.id !== id);
            renderDayTabs();
            renderItinerary();
            updateMapMarkers();
            saveToCloud(itineraryData);
        };

        window.copyShareLink = function() {
            const input = document.getElementById('share-link-input');
            if (input) {
                input.select();
                document.execCommand('copy');
                showToast("Copied share link to clipboard!");
            }
        };

        function showToast(text) {
            const toast = document.getElementById('toast-msg');
            const toastText = document.getElementById('toast-text');
            if (toast && toastText) {
                toastText.innerText = text;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
            }
        }

        function initMainMap() {
            mainMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([4.8950, 114.9380], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mainMap);
            updateMapMarkers();
        }

        function initTimePickerOptions() {
            const hourSelect = document.getElementById('input-time-hour');
            const minuteSelect = document.getElementById('input-time-minute');
            if (!hourSelect || !minuteSelect) return;

            let hourHtml = '';
            for (let h = 1; h <= 12; h++) {
                const val = h < 10 ? `0${h}` : `${h}`;
                hourHtml += `<option value="${val}">${val}</option>`;
            }
            hourSelect.innerHTML = hourHtml;

            let minuteHtml = '';
            for (let m = 0; m < 60; m += 5) {
                const val = m < 10 ? `0${m}` : `${m}`;
                minuteHtml += `<option value="${val}">${val}</option>`;
            }
            minuteSelect.innerHTML = minuteHtml;
        }

        function setupEventListeners() {
            const aiModal = document.getElementById('ai-modal');
            const modal = document.getElementById('add-modal');
            const shareModal = document.getElementById('share-modal');

            document.getElementById('btn-open-ai-top').addEventListener('click', () => aiModal.classList.remove('hidden'));
            document.getElementById('btn-nav-ai').addEventListener('click', () => aiModal.classList.remove('hidden'));
            document.getElementById('btn-close-ai-modal').addEventListener('click', () => aiModal.classList.add('hidden'));
            document.getElementById('btn-cancel-ai').addEventListener('click', () => aiModal.classList.add('hidden'));
            document.getElementById('btn-generate-ai').addEventListener('click', generateAIItinerary);

            document.getElementById('btn-share-itinerary').addEventListener('click', () => {
                updateShareLinkInput();
                shareModal.classList.remove('hidden');
            });

            document.getElementById('btn-close-share-modal').addEventListener('click', () => shareModal.classList.add('hidden'));
            document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.add('hidden'));
            document.getElementById('btn-cancel').addEventListener('click', () => modal.classList.add('hidden'));

            document.getElementById('btn-add-plan').addEventListener('click', () => {
                document.getElementById('add-plan-form').reset();
                modal.classList.remove('hidden');
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTimePickerOptions();
            initMainMap();
            renderDayTabs();
            renderDatePicker();
            renderItinerary();
            setupEventListeners();
            initCloudSync();

            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                const keyInput = document.getElementById('gemini-api-key');
                if (keyInput) keyInput.value = savedKey;
            }
        });
    </script>
</body>
</html>
